[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "triagemcp"
version = "0.1.0"
description = "Agentic security-alert triage engine exposed over the Model Context Protocol."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Alessandro Klinkovich", email = "alessandroklinkovich@gmail.com" }]
keywords = ["security", "triage", "mcp", "llm", "agent", "mitre-attack"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
    "Intended Audience :: Developers",
    "Topic :: Security",
]
dependencies = [
    "anthropic>=0.40",
    "mcp[cli]>=1.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.scripts]
triagemcp = "triagemcp.cli:app"

[project.urls]
Repository = "https://github.com/alessandroklinkovich/TriageMCP"

[tool.hatch.build.targets.wheel]
packages = ["src/triagemcp"]

# ---------------------------------------------------------------------------
# Ruff: lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "ANN",  # flake8-annotations
    "ASYNC", # flake8-async
    "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# Tests may use long descriptive assertion messages and fixtures.
"tests/**" = ["E501"]

# ---------------------------------------------------------------------------
# mypy: strict, with the pydantic plugin
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "live: exercises the real Anthropic API; skipped unless --run-live is passed",
]
